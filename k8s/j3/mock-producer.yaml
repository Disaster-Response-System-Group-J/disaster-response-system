# Build this image first: docker build -t j3-mock-producer:latest -f Dockerfile.mock j3-system-interaction/dms
# Then load into minikube: minikube image load j3-mock-producer:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: j3-mock-producer
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j3-mock-producer
  template:
    metadata:
      labels:
        app: j3-mock-producer
    spec:
      containers:
        - name: j3-mock-producer
          image: j3-mock-producer:latest
          imagePullPolicy: Never
          command: ["node", "mock-producer.js"]
          env:
            - name: KAFKA_BROKER
              value: kafka:29092
