# Build this image first: docker build -t j3-event-bridge:latest -f Dockerfile.mock j3-system-interaction/dms
# Then load into minikube: minikube image load j3-event-bridge:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: j3-event-bridge
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j3-event-bridge
  template:
    metadata:
      labels:
        app: j3-event-bridge
    spec:
      containers:
        - name: j3-event-bridge
          image: j3-event-bridge:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: kafka:29092
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: j3-event-bridge
  namespace: disaster-response
spec:
  selector:
    app: j3-event-bridge
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
