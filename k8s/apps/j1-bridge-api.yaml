apiVersion: apps/v1
kind: Deployment
metadata:
  name: j1-bridge-api
  namespace: disaster-response
  labels:
    app: j1-bridge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j1-bridge-api
  template:
    metadata:
      labels:
        app: j1-bridge-api
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "until nc -w1 kafka 29092 >/dev/null 2>&1; do echo 'waiting for kafka...'; sleep 3; done",
            ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: j1-bridge-api
          image: dehanns/disaster-j1-bridge-api:sha-dac6932
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC_EVENTS
              value: "j1.events"
            - name: KAFKA_PRODUCER_TIMEOUT
              value: "10"
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: CORS_ORIGINS
              value: "*"
            - name: IDEMPOTENCY_MAX_KEYS
              value: "50000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: j1-bridge-api
  namespace: disaster-response
spec:
  type: ClusterIP
  selector:
    app: j1-bridge-api
  ports:
    - port: 8000
      targetPort: 8000
