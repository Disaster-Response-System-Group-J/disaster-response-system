apiVersion: apps/v1
kind: Deployment
metadata:
  name: j3-event-bridge
  namespace: disaster-response
  labels:
    app: j3-event-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j3-event-bridge
  template:
    metadata:
      labels:
        app: j3-event-bridge
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 kafka 29092 >/dev/null 2>&1; do echo 'waiting for kafka...'; sleep 3; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: j3-event-bridge
          image: dehanns/disaster-j3-event-bridge:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: KAFKA_BROKER
              value: "kafka:29092"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /socket.io/?EIO=4&transport=polling
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /socket.io/?EIO=4&transport=polling
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: j3-event-bridge
  namespace: disaster-response
spec:
  type: ClusterIP
  selector:
    app: j3-event-bridge
  ports:
    - port: 3001
      targetPort: 3001
