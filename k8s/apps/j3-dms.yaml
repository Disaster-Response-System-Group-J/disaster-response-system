apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: j3-dms-data
  namespace: disaster-response
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: j3-dms
  namespace: disaster-response
  labels:
    app: j3-dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j3-dms
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: j3-dms
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "until nc -w1 postgres 5432 >/dev/null 2>&1; do echo 'waiting for postgres...'; sleep 3; done",
            ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "until nc -w1 kafka 29092 >/dev/null 2>&1; do echo 'waiting for kafka...'; sleep 3; done",
            ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-event-bridge
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 j3-event-bridge 3001 >/dev/null 2>&1; do echo 'waiting for j3-event-bridge...'; sleep 3; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: j3-dms

          image: dehanns/disaster-j3-dms:sha-aaf34ca
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J3_DATABASE_URL
            - name: SQLITE_DB_PATH
              value: "/app/data/local_alerts.db"
            - name: AUDIT_API_BASE_URL
              value: "http://j4-audit-api:8084"
            - name: KAFKA_BROKER
              value: "kafka:29092"
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom: 
                secretKeyRef:
                  name: disaster-secrets
                  key: NEXT_PUBLIC_SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: NEXT_PUBLIC_SUPABASE_ANON_KEY
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: j3-dms-data
---
apiVersion: v1
kind: Service
metadata:
  name: j3-dms
  namespace: disaster-response
spec:
  type: LoadBalancer
  selector:
    app: j3-dms
  ports:
    - port: 3000
      targetPort: 3000
