apiVersion: apps/v1
kind: Deployment
metadata:
  name: j2-data-intelligence
  namespace: disaster-response
  labels:
    app: j2-data-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j2-data-intelligence
  template:
    metadata:
      labels:
        app: j2-data-intelligence
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "until nc -w1 postgres 5432 >/dev/null 2>&1; do echo 'waiting for postgres...'; sleep 3; done",
            ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "until nc -w1 kafka 29092 >/dev/null 2>&1; do echo 'waiting for kafka...'; sleep 3; done",
            ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: j2-data-intelligence
          image: dehanns/disaster-j2-data-intelligence:sha-1d92083
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J2_DATABASE_URL
            - name: KAFKA_BROKER
              value: "kafka:29092"
            - name: KAFKA_ALERT_THRESHOLD
              value: "0.0"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: j2-data-intelligence
  namespace: disaster-response
spec:
  type: ClusterIP
  selector:
    app: j2-data-intelligence
  ports:
    - port: 8082
      targetPort: 8082
