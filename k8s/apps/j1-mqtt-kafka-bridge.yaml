apiVersion: apps/v1
kind: Deployment
metadata:
  name: j1-mqtt-kafka-bridge
  namespace: disaster-response
  labels:
    app: j1-mqtt-kafka-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j1-mqtt-kafka-bridge
  template:
    metadata:
      labels:
        app: j1-mqtt-kafka-bridge
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 kafka 29092 >/dev/null 2>&1; do echo 'waiting for kafka...'; sleep 3; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: j1-mqtt-kafka-bridge
          image: dehanns/disaster-j1-mqtt-kafka-bridge:v1.1
          imagePullPolicy: Always
          env:
            - name: MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: MQTT_BROKER
            - name: MQTT_PORT
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: MQTT_PORT
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: MQTT_USERNAME
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: MQTT_PASSWORD
            - name: MQTT_TOPICS
              value: "j1/disaster/#"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC
              value: "disaster_data_stream"
            - name: KAFKA_TOPIC_FLOOD
              value: "j1.sensor.telemetry.flood"
            - name: KAFKA_TOPIC_LANDSLIDE
              value: "j1.sensor.telemetry.landslide"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
