# Prometheus scrape configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: disaster-response
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s
    rule_files: []
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [prometheus:9090]
      - job_name: kong
        metrics_path: /metrics
        static_configs:
          - targets: [kong:8001]
      - job_name: keycloak
        metrics_path: /metrics
        static_configs:
          - targets: [keycloak:8080]
      - job_name: grafana
        metrics_path: /metrics
        static_configs:
          - targets: [grafana:3000]
      - job_name: postgres
        static_configs:
          - targets: [postgres-exporter:9187]
---
# Grafana datasource — points Grafana at Prometheus automatically on startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: disaster-response
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# Grafana dashboard provider — tells Grafana where to find dashboard JSON files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: disaster-response
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: drs-dashboards
        orgId: 1
        folder: Disaster Response
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
