# ConfigMap — init.sh creates per-service databases + users on first boot
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: disaster-response
data:
  init.sh: |
    #!/usr/bin/env bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE USER ${J3_DB_USER} WITH PASSWORD '${J3_DB_PASSWORD}';
      CREATE DATABASE ${J3_DB_NAME} OWNER ${J3_DB_USER};

      CREATE USER ${KONG_DB_USER} WITH PASSWORD '${KONG_DB_PASSWORD}';
      CREATE DATABASE ${KONG_DB_NAME} OWNER ${KONG_DB_USER};

      CREATE USER ${KC_DB_USERNAME} WITH PASSWORD '${KC_DB_PASSWORD}';
      CREATE DATABASE keycloak OWNER ${KC_DB_USERNAME};
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: disaster-response
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: disaster-response
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_DB
            - name: J3_DB_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J3_DB_USER
            - name: J3_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J3_DB_PASSWORD
            - name: J3_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J3_DB_NAME
            - name: KONG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_USER
            - name: KONG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KONG_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_NAME
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KC_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "disaster", "-d", "disasterdb"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "disaster", "-d", "disasterdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://disaster:DisasterMangementSystem%40j2@localhost:5432/disasterdb?sslmode=disable"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-script
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: disaster-response
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
