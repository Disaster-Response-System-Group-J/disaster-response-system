# ConfigMap holds the SQL that runs once when Postgres starts for the first time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: disaster-response
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE USER j3user WITH PASSWORD '${J3_DB_PASSWORD}';
      CREATE DATABASE j3db OWNER j3user;
      CREATE USER kong WITH PASSWORD '${KONG_DB_PASSWORD}';
      CREATE DATABASE kong OWNER kong;
      CREATE USER keycloak WITH PASSWORD '${KEYCLOAK_DB_PASSWORD}';
      CREATE DATABASE keycloak OWNER keycloak;
    EOSQL
---
# PersistentVolumeClaim reserves disk space so data survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: disaster-response
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: disaster-response
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: POSTGRES_DB
            - name: J3_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J3_DB_PASSWORD
            - name: KONG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KEYCLOAK_DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
# ClusterIP service — only reachable from inside the cluster (other pods use "postgres:5432").
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: disaster-response
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
