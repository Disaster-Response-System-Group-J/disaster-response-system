# Job runs once to create Kong's database tables, then exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration
  namespace: disaster-response
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done']
      containers:
        - name: kong-migration
          image: kong:3.7
          command: ["kong", "migrations", "bootstrap"]
          env:
            - name: KONG_DATABASE
              value: postgres
            - name: KONG_PG_HOST
              value: postgres
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_USER
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_NAME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.7
          env:
            - name: KONG_DATABASE
              value: postgres
            - name: KONG_PG_HOST
              value: postgres
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_USER
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_NAME
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_LOG_LEVEL
              value: warn
          ports:
            - containerPort: 8000
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: disaster-response
spec:
  selector:
    app: kong
  type: NodePort
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30801
---
# Job runs once after Kong is ready to register the j3-dms route.
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-setup
  namespace: disaster-response
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kong-setup
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl -q
              until curl -sf http://kong:8001 >/dev/null 2>&1; do
                echo 'Waiting for Kong Admin API...'; sleep 3
              done
              curl -sf -X POST http://kong:8001/services \
                --data 'name=j3-dms' --data 'url=http://j3-dms:3000'
              curl -sf -X POST http://kong:8001/services/j3-dms/routes \
                --data 'name=j3-route' \
                --data 'paths[]=/api/v1/system' \
                --data 'strip_path=false'
              curl -sf -X POST http://kong:8001/routes/j3-route/plugins \
                --data 'name=rate-limiting' \
                --data 'config.minute=100' \
                --data 'config.policy=local'
              echo 'Kong setup complete'
