apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-setup-script
  namespace: disaster-response
data:
  setup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    KONG_ADMIN="${KONG_ADMIN:-http://kong:8001}"
    KC_REALM_URL="${KC_REALM_URL:-http://keycloak:8080/realms/disaster-response}"
    KC_ISSUER="${KC_ISSUER:-http://localhost:30180/realms/disaster-response}"
    KC_CONSUMER="keycloak-disaster-app"
    command -v jq >/dev/null 2>&1 || { echo "ERROR: jq required"; exit 1; }
    echo "==> Waiting for Kong..."
    until curl -sf "$KONG_ADMIN" >/dev/null; do sleep 2; done
    echo "==> Waiting for Keycloak realm..."
    until curl -sf -H 'X-Forwarded-Proto: https' "$KC_REALM_URL" >/dev/null; do sleep 2; done

    # Services
    for svc_url in "j1-device-edge:http://j1-bridge-api:8000" \
                   "j2-data-intelligence:http://j2-data-intelligence:8082" \
                   "j3-system-interaction:http://j3-dms:3000" \
                   "j4-audit-api:http://j4-audit-api:8084"; do
      name="${svc_url%%:http*}"; url="http${svc_url#*:http}"
      curl -s -X POST "$KONG_ADMIN/services" --data "name=$name" --data "url=$url" >/dev/null \
        && echo "    $name OK"
    done

    # JWT consumer + credential
    KC_PUB_B64=$(curl -sf -H 'X-Forwarded-Proto: https' "$KC_REALM_URL" | jq -r '.public_key // empty')
    [[ -z "$KC_PUB_B64" ]] && { echo "ERROR: no public key from realm"; exit 1; }
    KC_PUB_KEY=$'-----BEGIN PUBLIC KEY-----\n'"$KC_PUB_B64"$'\n-----END PUBLIC KEY-----'
    curl -s -X POST "$KONG_ADMIN/consumers" --data "username=$KC_CONSUMER" >/dev/null
    curl -sf -X POST "$KONG_ADMIN/consumers/$KC_CONSUMER/jwt" \
      --data "key=$KC_ISSUER" --data 'algorithm=RS256' \
      --data-urlencode "rsa_public_key=$KC_PUB_KEY" >/dev/null && echo "    JWT credential OK"

    # Routes
    ROUTES=()
    reg() {
      local svc=$1 name=$2 path=$3 methods="${4:-}"
      local args=(--data "name=$name" --data "paths[]=$path" --data strip_path=false)
      [[ -n "$methods" ]] && { IFS=','; for m in $methods; do args+=(--data "methods[]=$m"); done; }
      curl -sf -X POST "$KONG_ADMIN/services/$svc/routes" "${args[@]}" >/dev/null \
        && ROUTES+=("$name") && echo "    $name OK"
    }
    attach_jwt() { curl -sf -X POST "$KONG_ADMIN/routes/$1/plugins" --data 'name=jwt' >/dev/null; }

    reg j1-device-edge        j1-route                   /api/v1/devices
    reg j2-data-intelligence  j2-route                   /api/v1/intelligence
    reg j3-system-interaction j3-auth-login              /api/auth/login              POST
    reg j3-system-interaction j3-reports-post            /api/reports                 POST
    reg j3-system-interaction j3-incidents-get           /api/incidents               GET
    reg j3-system-interaction j3-relief-shelter-get      /api/relief/shelter          GET
    reg j3-system-interaction j3-reports-rw              /api/reports                 GET,PATCH
    attach_jwt j3-reports-rw
    reg j3-system-interaction j3-incidents-post          /api/incidents               POST
    attach_jwt j3-incidents-post
    reg j3-system-interaction j3-incidents-patch         /api/incidents               PATCH
    attach_jwt j3-incidents-patch
    reg j3-system-interaction j3-dashboard-overview      /api/dashboard/overview      GET
    attach_jwt j3-dashboard-overview
    reg j3-system-interaction j3-sensors                 /api/sensors                 GET
    attach_jwt j3-sensors
    reg j3-system-interaction j3-analytics-situation     /api/analytics/situation     GET
    attach_jwt j3-analytics-situation
    reg j3-system-interaction j3-predictions             /api/predictions             GET
    attach_jwt j3-predictions
    reg j3-system-interaction j3-resources-list          /api/resources/list          GET,PATCH
    attach_jwt j3-resources-list
    reg j3-system-interaction j3-alerts-get              /api/alerts                  GET
    attach_jwt j3-alerts-get
    reg j3-system-interaction j3-alerts-post             /api/alerts                  POST
    attach_jwt j3-alerts-post
    reg j4-audit-api          j4-audit-route             /api/v1/audit

    # Rate limiting (100 req/min) on all routes
    for route in "${ROUTES[@]}"; do
      curl -s -X POST "$KONG_ADMIN/routes/$route/plugins" \
        --data name=rate-limiting --data config.minute=100 --data config.policy=local >/dev/null \
        && echo "    $route rate-limit OK"
    done
    echo "==> Kong setup complete!"
---
# ── Kong DB migration (one-shot Job) ──────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration
  namespace: disaster-response
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 postgres 5432 >/dev/null 2>&1; do sleep 2; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: kong-migration
          image: kong:3.7
          imagePullPolicy: IfNotPresent
          command: ["kong", "migrations", "bootstrap"]
          env:
            - name: KONG_DATABASE
              value: "postgres"
            - name: KONG_PG_HOST
              value: "postgres"
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_USER
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: disaster-response
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 postgres 5432 >/dev/null 2>&1; do sleep 2; done; sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: kong
          image: kong:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "postgres"
            - name: KONG_PG_HOST
              value: "postgres"
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_USER
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_PASSWORD
            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KONG_DB_NAME
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_LOG_LEVEL
              value: "warn"
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
            - name: KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES
              value: "cjson.safe"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: disaster-response
spec:
  selector:
    app: kong
  type: ClusterIP
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: admin
      port: 8001
      targetPort: 8001
---
# One-shot Job — registers services, routes, and JWT plugin in Kong
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-setup
  namespace: disaster-response
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kong
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 kong 8001 >/dev/null 2>&1; do echo 'waiting for kong...'; sleep 3; done; sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-keycloak
          image: busybox:1.37
          command: ["sh", "-c", "until nc -w1 keycloak 8080 >/dev/null 2>&1; do sleep 3; done; sleep 10"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: kong-setup
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache bash curl jq -q
              bash /setup/setup.sh
          env:
            - name: KONG_ADMIN
              value: "http://kong:8001"
            - name: KC_REALM_URL
              value: "http://keycloak:8080/realms/disaster-response"
            - name: KC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: KC_ISSUER
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /setup
      volumes:
        - name: script
          configMap:
            name: kong-setup-script
            defaultMode: 0755
