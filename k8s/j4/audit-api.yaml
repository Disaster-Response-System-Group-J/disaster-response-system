# Shared volume: deploy-contract Job writes the contract address here,
# and j4-audit-api reads it at startup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-deployment-pvc
  namespace: disaster-response
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
# Job runs once — deploys the smart contract to the hardhat blockchain.
apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-audit-contract
  namespace: disaster-response
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-hardhat
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z hardhat-node 8545; do echo waiting for hardhat; sleep 3; done']
      containers:
        - name: deployer
          image: 828479100417.dkr.ecr.ap-south-1.amazonaws.com/disaster-response/j4-hardhat:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: deployment
              mountPath: /deployment
      volumes:
        - name: deployment
          persistentVolumeClaim:
            claimName: audit-deployment-pvc
---
# Build this image first: docker build -t j4-audit-api:latest j4-platform-security/blockchain-audit
# Then load into minikube: minikube image load j4-audit-api:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: j4-audit-api
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j4-audit-api
  template:
    metadata:
      labels:
        app: j4-audit-api
    spec:
      initContainers:
        - name: wait-for-contract
          image: busybox:1.36
          command: ['sh', '-c', 'until [ -f /deployment/audit-contract-address.txt ]; do echo waiting for contract deployment; sleep 5; done']
          volumeMounts:
            - name: deployment
              mountPath: /deployment
      containers:
        - name: j4-audit-api
          image: 828479100417.dkr.ecr.ap-south-1.amazonaws.com/disaster-response/j4-audit-api:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8084"
            - name: BLOCKCHAIN_RPC_URL
              value: http://hardhat-node:8545
            - name: AUDIT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: AUDIT_PRIVATE_KEY
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: deployment
              mountPath: /deployment
              readOnly: true
      volumes:
        - name: deployment
          persistentVolumeClaim:
            claimName: audit-deployment-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: j4-audit-api
  namespace: disaster-response
spec:
  selector:
    app: j4-audit-api
  type: NodePort
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
