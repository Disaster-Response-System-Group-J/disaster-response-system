apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardhat-node
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hardhat-node
  template:
    metadata:
      labels:
        app: hardhat-node
    spec:
      containers:
        - name: hardhat-node
          image: j4-hardhat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8545
          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hardhat-node
  namespace: disaster-response
spec:
  selector:
    app: hardhat-node
  type: NodePort
  ports:
    - port: 8545
      targetPort: 8545
      nodePort: 30545
