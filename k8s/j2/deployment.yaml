# Build this image first (from project root):
#   eval $(minikube docker-env)
#   docker build -t j2-data-intelligence:latest j2-data-intelligence/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: j2-data-intelligence
  namespace: disaster-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j2-data-intelligence
  template:
    metadata:
      labels:
        app: j2-data-intelligence
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 29092; do echo waiting for kafka; sleep 3; done']
      containers:
        - name: j2-data-intelligence
          image: j2-data-intelligence:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: disaster-secrets
                  key: J2_DATABASE_URL
            - name: KAFKA_BROKER
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
