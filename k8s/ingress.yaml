apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: disaster-ingress
  namespace: disaster-response
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: 188.166.197.144.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: j3-dms
            port:
              number: 3000
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kong
            port:
              number: 8000
