version: "3.8"

services:
  # ── Kong Database ─────────────────────────────────────────────────────────
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kong Migrations (runs once, sets up Kong's tables) ────────────────────
  kong-migrations:
    image: kong:3.4
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  # ── Kong API Gateway ──────────────────────────────────────────────────────
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000" # All API requests go here
      - "8001:8001" # Kong admin — J4 only
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (Authentication & Identity) ──────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── Application Database (shared by J1, J2, J3, J4) ──────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster123
      POSTGRES_DB: disasterdb
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "disaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vault (Secrets Management) ────────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (Metrics Collection) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./j4-platform-security/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana (Dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  # Hardhat Node for Blockchain Testing ─────────────────────────
  # Local Hardhat blockchain node for J4 blockchain audit demo/development.
  hardhat-node:
    image: node:22-alpine
    container_name: hardhat-node
    working_dir: /app
    volumes:
      - ./j4-platform-security/blockchain-audit:/app
      - hardhat-node-modules:/app/node_modules
    command: sh -c "npm ci && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"

  # One-time deployment container. It deploys IncidentAuditLog and writes the
  # contract address to the shared audit-deployment volume.
  deploy-audit-contract:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./j4-platform-security/blockchain-audit:/app
      - hardhat-node-modules:/app/node_modules
      - audit-deployment:/deployment
    command: sh -c "npm ci && npx hardhat run scripts/deploy.ts --network docker"
    depends_on:
      - hardhat-node
    restart: "no"

  # J4 blockchain audit API. It reads the contract address from /deployment.
  # AUDIT_PRIVATE_KEY still comes from the root .env file.
  # This setup is for local demo/development only.
  j4-audit-api:
    build: ./j4-platform-security/blockchain-audit
    container_name: j4-audit-api
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      BLOCKCHAIN_RPC_URL: http://hardhat-node:8545
      AUDIT_PRIVATE_KEY: ${AUDIT_PRIVATE_KEY}
    volumes:
      - audit-deployment:/deployment:ro
    depends_on:
      deploy-audit-contract:
        condition: service_completed_successfully

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  kong-db-data:
  app-db-data:
  grafana-data:
  # Keeps Docker's Linux node_modules separate from Windows host node_modules.
  hardhat-node-modules:
  # Shared volume used to pass the deployed contract address to the API.
  audit-deployment:
