services:

  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE  (managed by J4)
  # ─────────────────────────────────────────────────────────────

  # Shared PostgreSQL — creates j3db, kong, keycloak databases via init.sql
  postgres:
    image: postgres:16-alpine
    container_name: disaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disaster-net

  # Apache Kafka — KRaft mode, dual listener (EXTERNAL for host, INTERNAL for containers)
  kafka:
    image: apache/kafka:latest
    container_name: disaster-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - disaster-net

  # Postgres exporter — exposes Postgres metrics for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: disaster-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

  # Keycloak exporter — exposes Keycloak metrics for Prometheus
  keycloak-exporter:
    image: quay.io/integr8ly/keycloak-exporter:2.5
    container_name: disaster-keycloak-exporter
    restart: unless-stopped
    environment:
      KC_URL: "http://keycloak:8080"
      KC_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_REALM: "master"
      METRICS_PORT: "9404"
    ports:
      - "9404:9404"
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - disaster-net

  # Keycloak — identity & access management, imports disaster-response realm on startup
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: disaster-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_METRICS_ENABLED: "true"
      KC_METRICS_PATH: "/metrics"
    ports:
      - "8180:8080"
    volumes:
      - ./j4-platform-security/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

  # Kong DB migration — runs once to bootstrap Kong's schema
  kong-migration:
    image: kong:3.7
    container_name: disaster-kong-migration
    restart: "no"
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: ${KONG_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

  # Kong API Gateway — all external API traffic routes through here
  kong:
    image: kong:3.7
    container_name: disaster-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: ${KONG_DB_NAME}
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: warn
    ports:
      - "8000:8000"   # proxy — all API requests go here
      - "8001:8001"   # admin API
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    networks:
      - disaster-net

  # Kong route registration — runs once after Kong is healthy
  kong-setup:
    image: alpine:3.19
    container_name: disaster-kong-setup
    restart: "no"
    entrypoint: >
      sh -c "
        apk add --no-cache curl -q &&
        until curl -sf http://kong:8001 >/dev/null 2>&1; do
          echo 'Waiting for Kong Admin API...'; sleep 3;
        done;
        curl -sf -X POST http://kong:8001/services \
          --data 'name=j3-dms' \
          --data 'url=http://j3-dms:3000' && echo 'Registered j3-dms';
        curl -sf -X POST http://kong:8001/services/j3-dms/routes \
          --data 'name=j3-route' \
          --data 'paths[]=/api/v1/system' \
          --data 'strip_path=false' && echo 'Created j3-route';
        curl -sf -X POST http://kong:8001/routes/j3-route/plugins \
          --data 'name=rate-limiting' \
          --data 'config.minute=100' \
          --data 'config.policy=local' && echo 'Rate limiting applied';
        echo 'Kong setup complete';
      "
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - disaster-net

  # Prometheus — metrics collection
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: disaster-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - disaster-net

  # Grafana — observability dashboards (port 3030 — J3 DMS uses 3000)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: disaster-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./j4-platform-security/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./j4-platform-security/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J3 — System Engineering & Interaction
  # ─────────────────────────────────────────────────────────────

  # Event Bridge — Kafka consumer → Socket.IO relay (real-time dashboard updates)
  j3-event-bridge:
    build:
      context: ./j3-system-interaction/dms
      dockerfile: Dockerfile.mock
    container_name: j3-event-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # Mock Producer — feeds synthetic SOS/sensor/alert events into Kafka for testing
  j3-mock-producer:
    build:
      context: ./j3-system-interaction/dms
      dockerfile: Dockerfile.mock
    container_name: j3-mock-producer
    restart: unless-stopped
    command: ["node", "mock-producer.js"]
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # J3 DMS — Next.js command centre dashboard
  j3-dms:
    build:
      context: ./j3-system-interaction/dms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    container_name: j3-dms
    restart: unless-stopped
    env_file:
      - ./j3-system-interaction/dms/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      j3-event-bridge:
        condition: service_started
    networks:
      - disaster-net

