services:
  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE  (managed by J4)
  # ─────────────────────────────────────────────────────────────

  # Shared PostgreSQL — creates j3db, kong, keycloak databases via init.sql
  postgres:
    image: postgres:16-alpine
    container_name: disaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J1 — Device & Edge Systems: MQTT-Kafka bridge
  # Subscribes to HiveMQ (j1/disaster/#) and routes sensor data
  # into two separate Kafka topics:
  #   j1.sensor.telemetry.flood     ← flood sensor readings
  #   j1.sensor.telemetry.landslide ← landslide sensor readings
  # Both J1 and J2 teams consume from the same root Kafka cluster
  # at kafka:29092.
  # ─────────────────────────────────────────────────────────────
  mqtt-kafka-bridge:
    build:
      context: ./j1-device-edge/mqtt-kafka-bridge
    container_name: disaster-mqtt-kafka-bridge
    restart: unless-stopped
    environment:
      MQTT_BROKER: 8e659da889be4ff7a3d839144a0f8aaa.s1.eu.hivemq.cloud
      MQTT_PORT: 8883
      MQTT_USERNAME: j1_gateway
      MQTT_PASSWORD: 8797Sudil
      MQTT_TOPICS: j1/disaster/#
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: disaster_data_stream
      KAFKA_TOPIC_FLOOD: j1.sensor.telemetry.flood
      KAFKA_TOPIC_LANDSLIDE: j1.sensor.telemetry.landslide
    depends_on:
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # Apache Kafka — KRaft mode, dual listener (EXTERNAL for host, INTERNAL for containers)
  kafka:
    image: apache/kafka:latest
    container_name: disaster-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - disaster-net

  # Kafka Exporter — exposes Kafka metrics for Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: disaster-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "9308"
      prometheus-path: "/metrics"
      prometheus-job: "kafka"
    command:
      - --kafka.server=kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # Postgres exporter — exposes Postgres metrics for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: disaster-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "9187"
      prometheus-path: "/metrics"
      prometheus-job: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

# keycloak-exporter:
  #   image: ghcr.io/ivanklee86/keycloak_exporter:latest
  #   container_name: disaster-keycloak-exporter
  #   restart: unless-stopped
  #   environment:
  #     KC_URL: "http://keycloak:8080"
  #     KC_USERNAME: "${KEYCLOAK_ADMIN}"
  #     KC_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
  #     KC_REALM: "master"
  #     METRICS_PORT: "9404"
  #   ports:
  #     - "9404:9404"
  #   depends_on:
  #     keycloak:
  #       condition: service_started
  #   networks:
  #     - disaster-net


  # Keycloak — identity & access management, imports disaster-response realm on startup
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: disaster-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak123}
      KC_METRICS_ENABLED: "true"
      KC_METRICS_PATH: "/metrics"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8180:8080"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "8080"
      prometheus-path: "/metrics"
      prometheus-job: "keycloak"
    volumes:
      - ./j4-platform-security/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

  # HashiCorp Vault — secrets management. Dev mode for local work:
  # in-memory storage, auto-unsealed, single root token. NOT for prod.
  vault:
    image: hashicorp/vault:1.17
    container_name: disaster-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    command: vault server -dev
    networks:
      - disaster-net

  # Vault secret seeding — runs once after Vault is up.
  vault-setup:
    image: alpine:3.19
    container_name: disaster-vault-setup
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./j4-platform-security/vault/setup.sh:/setup.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache bash curl -q
        bash /setup.sh
    depends_on:
      vault:
        condition: service_started
    networks:
      - disaster-net

  # Keycloak realm provisioning — runs once after Keycloak is up.
  keycloak-setup:
    image: alpine:3.19
    container_name: disaster-keycloak-setup
    restart: "no"
    environment:
      KC_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    volumes:
      - ./j4-platform-security/keycloak/setup.sh:/setup.sh:ro
    entrypoint: >
      sh -c "
        apk add --no-cache bash curl jq -q &&
        bash /setup.sh
      "
    depends_on:
      keycloak:
        condition: service_started
      vault-setup:
        condition: service_completed_successfully
    networks:
      - disaster-net

  # Kong DB migration — runs once to bootstrap Kong's schema
  kong-migration:
    image: kong:3.7
    container_name: disaster-kong-migration
    restart: "no"
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: ${KONG_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disaster-net

  # Kong API Gateway — all external API traffic routes through here
  kong:
    image: kong:3.7
    container_name: disaster-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: ${KONG_DB_NAME}
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: warn
    ports:
      - "8000:8000"
      - "8001:8001"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "8001"
      prometheus-path: "/metrics"
      prometheus-job: "kong"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    networks:
      - disaster-net

  # Kong route registration — runs once after Kong is healthy
  kong-setup:
    image: alpine:3.19
    container_name: disaster-kong-setup
    restart: "no"
    environment:
      KONG_ADMIN: http://kong:8001
    volumes:
      - ./j4-platform-security/kong/setup.sh:/setup.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache bash curl -q
        tr -d '\r' < /setup.sh > /tmp/kong-setup.sh
        chmod +x /tmp/kong-setup.sh
        bash /tmp/kong-setup.sh
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - disaster-net

  # Prometheus — metrics collection & alert evaluation
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: disaster-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "9090"
      prometheus-path: "/metrics"
      prometheus-job: "prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./prometheus/sd_config.json:/etc/prometheus/sd_config.json:ro
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    networks:
      - disaster-net

  # Alertmanager — alert routing, deduplication, and notification delivery
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: disaster-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "9093"
      prometheus-path: "/metrics"
      prometheus-job: "alertmanager"
    environment:
      ALERTMANAGER_EMAIL_PASSWORD: "${ALERTMANAGER_EMAIL_PASSWORD}"
    volumes:
      - ./j4-platform-security/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager_data:/alertmanager
    entrypoint:
    - sh
    - -c
    - 'sed "s|__ALERTMANAGER_EMAIL_PASSWORD__|$${ALERTMANAGER_EMAIL_PASSWORD}|g" /etc/alertmanager/alertmanager.yml.tpl > /alertmanager/alertmanager.yml && /bin/alertmanager --config.file=/alertmanager/alertmanager.yml --storage.path=/alertmanager --web.external-url=http://localhost:9093'
    networks:
      - disaster-net

  # Grafana — observability dashboards (port 3030 — J3 DMS uses 3000)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: disaster-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./j4-platform-security/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./j4-platform-security/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # ELK — logs collection, indexing, and search
  # ─────────────────────────────────────────────────────────────

  # Elasticsearch — stores all system logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: disaster-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - disaster-net

  # Elasticsearch bootstrap — ILM policy + index template for drs-logs-*
  elasticsearch-setup:
    image: alpine:3.19
    container_name: disaster-elasticsearch-setup
    restart: "no"
    environment:
      ELK_LOG_RETENTION_DAYS: ${ELK_LOG_RETENTION_DAYS:-14}
    volumes:
      - ./j4-platform-security/elk/scripts/bootstrap-elasticsearch.sh:/setup/bootstrap-elasticsearch.sh:ro
    entrypoint: ["sh", "/setup/bootstrap-elasticsearch.sh"]
    depends_on:
      - elasticsearch
    networks:
      - disaster-net

  # Environment-specific Elasticsearch bootstraps (run with --profile dev or --profile prod)
  elasticsearch-setup-dev:
    image: alpine:3.19
    container_name: disaster-elasticsearch-setup-dev
    restart: "no"
    profiles:
      - dev
    environment:
      ELK_LOG_RETENTION_DAYS: 7
    volumes:
      - ./j4-platform-security/elk/scripts/bootstrap-elasticsearch.sh:/setup/bootstrap-elasticsearch.sh:ro
    entrypoint: ["sh", "/setup/bootstrap-elasticsearch.sh"]
    depends_on:
      - elasticsearch
    networks:
      - disaster-net

  elasticsearch-setup-prod:
    image: alpine:3.19
    container_name: disaster-elasticsearch-setup-prod
    restart: "no"
    profiles:
      - prod
    environment:
      ELK_LOG_RETENTION_DAYS: 30
    volumes:
      - ./j4-platform-security/elk/scripts/bootstrap-elasticsearch.sh:/setup/bootstrap-elasticsearch.sh:ro
    entrypoint: ["sh", "/setup/bootstrap-elasticsearch.sh"]
    depends_on:
      - elasticsearch
    networks:
      - disaster-net

  # Logstash — receives Filebeat events and writes them to Elasticsearch
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: disaster-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./j4-platform-security/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./j4-platform-security/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      - elasticsearch
      - elasticsearch-setup
    networks:
      - disaster-net

  # Kibana — log search and visualization UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: disaster-kibana
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_NAME: disaster-kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - disaster-net

  # Kibana bootstrap — creates a default DRS logs data view
  kibana-setup:
    image: alpine:3.19
    container_name: disaster-kibana-setup
    restart: "no"
    volumes:
      - ./j4-platform-security/elk/scripts/bootstrap-kibana.sh:/setup/bootstrap-kibana.sh:ro
      - ./j4-platform-security/elk/kibana/drs-logs-dashboard.ndjson:/setup/drs-logs-dashboard.ndjson:ro
      - ./j4-platform-security/elk/kibana/drs-kong-dashboard.ndjson:/setup/drs-kong-dashboard.ndjson:ro
      - ./j4-platform-security/elk/kibana/drs-missing-trace-search.ndjson:/setup/drs-missing-trace-search.ndjson:ro
      - ./j4-platform-security/elk/scripts/create-kibana-alerts.sh:/setup/create-kibana-alerts.sh:ro
    entrypoint: ["sh", "/setup/bootstrap-kibana.sh"]
    depends_on:
      - kibana
    networks:
      - disaster-net

  # Filebeat — collects container stdout/stderr and forwards to Logstash
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: disaster-filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false", "-c", "/usr/share/filebeat/filebeat.yml"]
    volumes:
      - ./j4-platform-security/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J3 — System Engineering & Interaction
  # ─────────────────────────────────────────────────────────────

  # Event Bridge — Kafka consumer → Socket.IO relay (real-time dashboard updates)
  j3-event-bridge:
    build:
      context: ./j3-system-interaction/dms
      dockerfile: Dockerfile.mock
    container_name: j3-event-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # J3 DMS — Next.js command centre dashboard
  j3-dms:
    build:
      context: ./j3-system-interaction/dms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}:3000
        NEXT_PUBLIC_SOCKET_URL: http://${SERVER_IP:-localhost}:3001
    container_name: j3-dms
    restart: unless-stopped
    env_file:
      - ./j3-system-interaction/dms/.env
    ports:
      - "3000:3000"
    labels:
      prometheus-scrape: "true"
      prometheus-port: "3000"
      prometheus-path: "/api/metrics"
      prometheus-job: "j3-dms"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      j3-event-bridge:
        condition: service_started
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J1 — Device & Edge Systems
  # j1-bridge-api handles mobile SOS help requests → j1.events topic
  # mqtt-kafka-bridge handles sensor telemetry (defined above near kafka)
  # ─────────────────────────────────────────────────────────────
  # j1-device-edge:
  #   build: ./j1-device-edge/backend
  #   container_name: j1-bridge-api
  #   ports:
  #     - "8081:8000"
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     KAFKA_TOPIC_EVENTS: j1.events
  #   depends_on:
  #     kafka:
  #       condition: service_started
  #   networks:
  #     - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J2 — Data & Intelligence
  # Consumes from Kafka topics produced by J1:
  #   j1.sensor.telemetry.flood
  #   j1.sensor.telemetry.landslide
  #   j1.events
  # ─────────────────────────────────────────────────────────────
  j2-data-intelligence:
    build: ./j2-data-intelligence
    container_name: j2-data-intelligence
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BROKER: kafka:29092
      KAFKA_ALERT_THRESHOLD: "0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - disaster-net

  # ─────────────────────────────────────────────────────────────
  # J4 — Blockchain Audit (Hardhat local dev)
  # ─────────────────────────────────────────────────────────────

  # Local Hardhat blockchain node for J4 blockchain audit demo/development
  hardhat-node:
    image: node:22-alpine
    container_name: hardhat-node
    working_dir: /app
    volumes:
      - ./j4-platform-security/blockchain-audit:/app
      - hardhat-node-modules:/app/node_modules
    command: sh -c "npm ci && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    networks:
      - disaster-net

  # One-time deployment — deploys IncidentAuditLog contract and writes address to shared volume
  deploy-audit-contract:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./j4-platform-security/blockchain-audit:/app
      - hardhat-node-modules:/app/node_modules
      - audit-deployment:/deployment
    command: sh -c "npm ci && npx hardhat run scripts/deploy.ts --network docker"
    depends_on:
      - hardhat-node
    restart: "no"
    networks:
      - disaster-net

  # J4 blockchain audit API — reads contract address from /deployment volume
  j4-audit-api:
    build: ./j4-platform-security/blockchain-audit
    container_name: j4-audit-api
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      BLOCKCHAIN_RPC_URL: http://hardhat-node:8545
      AUDIT_PRIVATE_KEY: ${AUDIT_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - audit-deployment:/deployment:ro
    depends_on:
      deploy-audit-contract:
        condition: service_completed_successfully
    networks:
      - disaster-net

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  elasticsearch_data:
  logstash_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  kibana_data:
  hardhat-node-modules:
  audit-deployment:

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  disaster-net:
    driver: bridge
