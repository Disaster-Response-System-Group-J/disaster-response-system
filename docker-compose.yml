version: "3.8"

services:
  # ── Security Gateway ─────────────────────────
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong-db-data:/var/lib/postgresql/data

  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"   # All API requests go here
      - "8001:8001"   # Kong admin
    depends_on:
      - kong-database

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"

  # ── Observability ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./j4-platform-security/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123

  # ── Database (shared for dev) ─────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster123
      POSTGRES_DB: disasterdb
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data

volumes:
  kong-db-data:
  app-db-data: