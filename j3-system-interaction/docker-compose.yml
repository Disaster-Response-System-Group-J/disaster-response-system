services:
  # 1. Primary Database (Kept your exact setup)
  postgres:
    image: postgres:16-alpine
    container_name: j3-postgres
    restart: unless-stopped
    env_file:
      - ./dms/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U j3user -d j3db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - j3-net

  # 2. Apache Kafka (The Central Message Broker)
  kafka:
    image: apache/kafka:latest
    container_name: j4-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - j3-net

  # 3. Next.js Command Center (Kept your exact setup)
  dms:
    build:
      context: ./dms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    container_name: j3-dms
    restart: unless-stopped
    env_file:
      - ./dms/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - j3-net

volumes:
  postgres_data:

networks:
  j3-net:
    driver: bridge

# temporary docker compose file for development, will be removed in the future
# when we have other teams running their services in docker as well. 
# For now, this is just to make it easier for us to run the DMS without having to set up a local postgres database and mock server.