services:
  # 1. Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: j3-postgres
    restart: unless-stopped
    env_file:
      - ./dms/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U j3user -d j3db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - j3-net

  # 2. Apache Kafka (KRaft mode, dual-listener: EXTERNAL for host, INTERNAL for containers)
  kafka:
    image: apache/kafka:latest
    container_name: j4-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # host access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - j3-net

  # 3. Event Bridge (Kafka <-> Socket.IO relay, port 3001)
  event-bridge:
    build:
      context: ./dms
      dockerfile: Dockerfile.mock
    container_name: j3-event-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - j3-net

  # 4. Mock Producer (feeds test SOS/sensor/alert data into Kafka)
  mock-producer:
    build:
      context: ./dms
      dockerfile: Dockerfile.mock
    container_name: j3-mock-producer
    restart: unless-stopped
    command: ["node", "mock-producer.js"]
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - j3-net

  # 5. Next.js Command Center
  dms:
    build:
      context: ./dms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    container_name: j3-dms
    restart: unless-stopped
    env_file:
      - ./dms/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      event-bridge:
        condition: service_started
    networks:
      - j3-net

volumes:
  postgres_data:

networks:
  j3-net:
    driver: bridge
