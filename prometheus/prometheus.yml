global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # File-based service discovery — auto-refresh when sd_config.json changes
  - job_name: docker
    file_sd_configs:
      - files: ['/etc/prometheus/sd_config.json']
        refresh_interval: 30s
    relabel_configs:
      # Preserve job label from sd_config.json
      - source_labels: [job]
        target_label: job
      # Use the metrics_path from discovery config if provided
      - source_labels: [__metrics_path__]
        regex: '(.+)'
        target_label: __metrics_path__
      # Default metrics_path to /metrics when empty or missing
      - source_labels: [__metrics_path__]
        regex: '^$'
        target_label: __metrics_path__
        replacement: /metrics
