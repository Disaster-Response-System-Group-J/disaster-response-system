global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kong
    static_configs:
      - targets: ['kong:8001']
    metrics_path: /metrics

  # Add your service scrape targets below as teams integrate Prometheus exporters
  # - job_name: j3-dms
  #   static_configs:
  #     - targets: ['j3-dms:3000']
  #   metrics_path: /api/metrics
