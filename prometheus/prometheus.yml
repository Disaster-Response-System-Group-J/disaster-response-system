global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:8080

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: j1-device-edge
    static_configs:
      - targets:
          - j1-device-edge:8081

  - job_name: j2-data-intelligence
    static_configs:
      - targets:
          - j2-data-intelligence:8082

  - job_name: j3-dms
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - j3-dms:3000
