groups:
  - name: disaster_response_alerts
    interval: 15s
    rules:

      # ─────────────────────────────────────────────
      # General Service Availability
      # ─────────────────────────────────────────────

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      # ─────────────────────────────────────────────
      # Prometheus
      # ─────────────────────────────────────────────

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus failed to reload its configuration. Check for syntax errors."

      - alert: PrometheusMetricsDropped
        expr: increase(prometheus_tsdb_head_chunks_removed_total[1h]) > 100
        labels:
          severity: warning
        annotations:
          summary: "Prometheus metrics being dropped"
          description: "{{ $value }} metric chunks dropped in the last hour"

      - alert: PrometheusStorageRunningOut
        expr: (prometheus_tsdb_blocks_bytes / (prometheus_tsdb_blocks_bytes + prometheus_tsdb_wal_storage_size_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus storage running low"
          description: "Prometheus storage usage is above 80%: {{ $value | humanize }}%"

      # ─────────────────────────────────────────────
      # Alertmanager
      # ─────────────────────────────────────────────

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager has been unavailable for more than 1 minute — alerts will not be delivered"

      - alert: AlertmanagerNotificationFailed
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notification failed"
          description: "Alertmanager failed to send {{ $value }} notifications in the last 5 minutes"

      # ─────────────────────────────────────────────
      # PostgreSQL
      # ─────────────────────────────────────────────

      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL has been unavailable for more than 30 seconds"

      - alert: PostgreSQLConnectionHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "PostgreSQL active connections: {{ $value }} (threshold: 80)"

      - alert: PostgreSQLCacheHitRatioLow
        expr: |
          rate(pg_stat_bgwriter_buffers_clean_total[5m]) /
          (rate(pg_stat_bgwriter_buffers_clean_total[5m]) + rate(pg_stat_bgwriter_buffers_backend_total[5m]) + 1) < 0.99
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit ratio is low"
          description: "PostgreSQL cache hit ratio is {{ $value | humanizePercentage }} (threshold: 99%)"

      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="disasterdb"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $value }} deadlocks detected in disasterdb in the last 5 minutes"

      # ─────────────────────────────────────────────
      # Kong API Gateway
      # ─────────────────────────────────────────────

      - alert: KongDown
        expr: up{job="kong"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kong API Gateway is down"
          description: "Kong has been unavailable for more than 1 minute"

      - alert: KongHighErrorRate
        expr: |
          sum(rate(kong_http_requests_total{code=~"5.."}[5m])) /
          sum(rate(kong_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kong high error rate detected"
          description: "Kong 5xx error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: KongHighLatency
        expr: histogram_quantile(0.95, sum(rate(kong_request_latency_ms_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kong high latency detected"
          description: "Kong p95 latency is {{ $value }}ms (threshold: 1000ms)"

      # ─────────────────────────────────────────────
      # Keycloak
      # ─────────────────────────────────────────────

      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Keycloak authentication service is down"
          description: "Keycloak has been unavailable for more than 1 minute"

      - alert: KeycloakHighLoginFailures
        expr: increase(keycloak_failed_login_attempts_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak high login failure rate"
          description: "{{ $value }} login failures in the last 5 minutes — possible brute force attack"

      # ─────────────────────────────────────────────
      # Grafana
      # ─────────────────────────────────────────────

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Grafana observability dashboard is down"
          description: "Grafana has been unavailable for more than 2 minutes"

      # ─────────────────────────────────────────────
      # Kafka
      # ─────────────────────────────────────────────

      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka has been unavailable for more than 1 minute — disaster event streaming is broken"

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag is {{ $value }} on topic {{ $labels.topic }}"

      - alert: KafkaConsumerLagCritical
        expr: kafka_consumergroup_lag > 5000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer lag is critically high"
          description: "Consumer group {{ $labels.consumergroup }} lag is {{ $value }} on topic {{ $labels.topic }} — disaster events may be lost"

      # ─────────────────────────────────────────────
      # J1 — Device & Edge
      # ─────────────────────────────────────────────

      - alert: J1DeviceEdgeDown
        expr: up{job="j1-device-edge"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "J1 Device Edge service is down"
          description: "Sensor data collection and edge reporting is unavailable"

      # ─────────────────────────────────────────────
      # J2 — Data Intelligence
      # ─────────────────────────────────────────────

      - alert: J2DataIntelligenceDown
        expr: up{job="j2-data-intelligence"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "J2 Data Intelligence service is down"
          description: "ML predictions and risk analysis is unavailable"

      # ─────────────────────────────────────────────
      # J3 — Disaster Management System (DMS)
      # ─────────────────────────────────────────────

      - alert: J3DMSDown
        expr: up{job="j3-dms"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "J3 DMS (Dashboard) is down"
          description: "Command centre dashboard is unavailable"

      - alert: J3DMSHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="j3-dms", status=~"5.."}[5m])) /
          sum(rate(http_requests_total{job="j3-dms"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "J3 DMS high error rate"
          description: "J3 DMS 5xx error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: J3DMSHighMemoryUsage
        expr: process_resident_memory_bytes{job="j3-dms"} > 500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "J3 DMS high memory usage"
          description: "J3 DMS memory usage is {{ $value | humanize }} bytes (threshold: 500MB)"