groups:
  - name: disaster_response_alerts
    interval: 15s
    rules:
      # Service availability alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        annotations:
          summary: "{{ $labels.job }} service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"
          severity: "critical"

      # Prometheus specific alerts
      - alert: PrometheusConfigReload
        expr: changes(prometheus_config_last_reload_successful[1h]) > 0
        for: 5m
        annotations:
          summary: "Prometheus configuration reloaded"
          description: "Prometheus config was reloaded. Check for errors."
          severity: "warning"

      # Database alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 30s
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL has been unavailable for more than 30 seconds"
          severity: "critical"

      - alert: PostgreSQLConnectionHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "PostgreSQL active connections: {{ $value }} (threshold: 80)"
          severity: "warning"

      - alert: PostgreSQLCacheHitRatioLow
        expr: rate(pg_stat_blks_hit[5m]) / (rate(pg_stat_blks_hit[5m]) + rate(pg_stat_blks_read[5m])) < 0.99
        for: 10m
        annotations:
          summary: "PostgreSQL cache hit ratio is low"
          description: "PostgreSQL cache hit ratio: {{ $value | humanizePercentage }} (threshold: 99%)"
          severity: "warning"

      # Kong API Gateway alerts
      - alert: KongDown
        expr: up{job="kong"} == 0
        for: 1m
        annotations:
          summary: "Kong API Gateway is down"
          description: "Kong has been unavailable for more than 1 minute"
          severity: "critical"

      - alert: KongHighErrorRate
        expr: rate(kong_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "Kong high error rate detected"
          description: "Kong 5xx error rate: {{ $value | humanizePercentage }} (threshold: 5%)"
          severity: "warning"

      - alert: KongHighLatency
        expr: histogram_quantile(0.95, rate(kong_http_request_duration_ms_bucket[5m])) > 1000
        for: 5m
        annotations:
          summary: "Kong high latency detected"
          description: "Kong 95th percentile latency: {{ $value }}ms (threshold: 1000ms)"
          severity: "warning"

      # Keycloak authentication service alerts
      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 1m
        annotations:
          summary: "Keycloak authentication service is down"
          description: "Keycloak has been unavailable for more than 1 minute"
          severity: "critical"

      - alert: KeycloakHighRequestLatency
        expr: rate(keycloak_request_duration_seconds_bucket[5m]) > 0.1
        for: 5m
        annotations:
          summary: "Keycloak high request latency"
          description: "Keycloak is experiencing high request latency"
          severity: "warning"

      # Grafana dashboard alerts
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        annotations:
          summary: "Grafana observability dashboard is down"
          description: "Grafana has been unavailable for more than 2 minutes"
          severity: "warning"

      # J1 Device Edge alerts
      - alert: J1DeviceEdgeDown
        expr: up{job="j1-device-edge"} == 0
        for: 2m
        annotations:
          summary: "J1 Device Edge service is down"
          description: "Device edge collection is unavailable"
          severity: "critical"

      # J2 Data Intelligence alerts
      - alert: J2DataIntelligenceDown
        expr: up{job="j2-data-intelligence"} == 0
        for: 2m
        annotations:
          summary: "J2 Data Intelligence service is down"
          description: "ML predictions and data processing is unavailable"
          severity: "critical"

      # J3 DMS - Disaster Management System alerts
      - alert: J3DMSDown
        expr: up{job="j3-dms"} == 0
        for: 1m
        annotations:
          summary: "J3 DMS (Dashboard) is down"
          description: "Command centre dashboard is unavailable"
          severity: "critical"

      - alert: J3DMSHighMemoryUsage
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.2
        for: 5m
        annotations:
          summary: "J3 DMS high memory usage"
          description: "Available memory below 20%"
          severity: "warning"

      # Prometheus alerts
      - alert: PrometheusMetricsDropped
        expr: increase(prometheus_tsdb_metric_chunks_dropped_total[1h]) > 100
        annotations:
          summary: "Prometheus metrics being dropped"
          description: "{{ $value }} metrics dropped in last hour"
          severity: "warning"

      - alert: PrometheusStorageSpaceRunningOut
        expr: prometheus_tsdb_symbol_table_size_bytes / prometheus_tsdb_symbol_table_size_bytes * 100 > 80
        for: 5m
        annotations:
          summary: "Prometheus storage running low"
          description: "Prometheus storage usage above 80%"
          severity: "warning"
