name: Branch Name Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch name: $BRANCH"

          # Allow: feat/j1/..., fix/j2/..., chore/j3/..., docs/j4/...
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|test)/(j1|j2|j3|j4)/.+ ]]; then
            echo "❌ Branch name '$BRANCH' does not follow convention"
            echo "✅ Required format: feat/j1/your-feature-name"
            echo "Examples:"
            echo "   feat/j1/mqtt-collector"
            echo "   fix/j2/kafka-consumer"
            echo "   chore/j4/github-actions-ci"
            exit 1
          fi

          echo "Branch name is valid"
