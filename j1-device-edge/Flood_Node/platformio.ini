; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor speed - match this in your Serial.begin()
monitor_speed = 115200

; Libraries required for the project
lib_deps =
    ; LoRa and Sensore Libraries
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    
    ; MQTT Library (Industry standard)
    knolleary/PubSubClient @ ^2.8
    
    ; JSON Library (For the "Contract" with Group 2)
    bblanchon/ArduinoJson @ ^7.0.4

; Optional: File System for Offline buffering (LittleFS)
board_build.filesystem = littlefs