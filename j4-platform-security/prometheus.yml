global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:8080

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187