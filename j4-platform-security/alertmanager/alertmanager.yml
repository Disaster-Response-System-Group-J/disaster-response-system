global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Override routing for critical alerts
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h
    
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/alert'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:5001/alert'
        send_resolved: true
    email_configs:
      - to: 'pisandeniwith@gmail.com'
        from: 'alertmanager@disaster-response.local'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'pisandeniwith@gmail.com'
        auth_password: 'REPLACE_WITH_REAL_PASSWORD'
        require_tls: true
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://localhost:5001/alert'
        send_resolved: true

inhibit_rules:
  # Inhibit warning alerts if corresponding critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
