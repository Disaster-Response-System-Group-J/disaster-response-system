input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "service_name" => "%{[container][name]}"
    }
  }

  # Parse JSON logs emitted by j3-dms (if/when app logs JSON)
  if [container][name] =~ /j3-dms$/ {
    json {
      source => "message"
      target => "j3"
      skip_on_invalid_json => true
      tag_on_failure => ["_j3_json_parse_failure"]
    }

    if [j3][level] {
      mutate {
        add_field => { "log.level" => "%{[j3][level]}" }
      }
    }
    if [j3][requestId] {
      mutate {
        add_field => { "request_id" => "%{[j3][requestId]}" }
      }
    }
    if [j3][traceId] {
      mutate {
        add_field => { "trace.id" => "%{[j3][traceId]}" }
      }
    }
  }

  # Parse Kong access log fields
  if [container][name] =~ /kong$/ {
    grok {
      match => {
        "message" => [
          "%{IPORHOST:client.ip} - %{DATA:user.name} \[%{HTTPDATE:kong.access.time}\] \"%{WORD:http.request.method} %{DATA:url.original} HTTP/%{NUMBER:http.version}\" %{NUMBER:http.response.status_code:int} %{NUMBER:http.response.body.bytes:int} \"%{DATA:http.request.referrer}\" \"%{DATA:user_agent.original}\""
        ]
      }
      tag_on_failure => ["_kong_grok_failure"]
    }

    date {
      match => ["kong.access.time", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      tag_on_failure => ["_kong_date_failure"]
    }
  }

  # Generic request/trace id extraction across plaintext logs
  grok {
    match => {
      "message" => [
        "(?:trace[_-]?id|traceId)[=: ]%{NOTSPACE:trace.id}",
        "(?:request[_-]?id|requestId)[=: ]%{NOTSPACE:request_id}"
      ]
    }
    break_on_match => false
    tag_on_failure => []
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "drs-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
  stdout { codec => rubydebug }
}
