name: CI — Disaster Response System (Group J)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  ORG: disaster-response-system-group-j

jobs:
  # ─────────────────────────────────────────────
  # J2 — Data & Intelligence (Python / FastAPI)
  # ─────────────────────────────────────────────
  j2-ci:
    name: "J2 · Python — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j2-data-intelligence

    # Only run when J2 files change
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'j2-data-intelligence')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          #cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt yet — installing known deps temporarily"
            pip install pandas numpy joblib scikit-learn
          fi

      - name: Lint (flake8)
        run: |
          pip install flake8
          # Fail on syntax errors or undefined names; warn on style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests (pytest)
        run: |
          pip install pytest pytest-cov
          if find . \
            -path "./Model Training and Validation" -prune -o \
            -name "test_*.py" -print -o \
            -name "*_test.py" -print | grep -q .; then
            pytest -v \
              --ignore="Model Training and Validation"
          else
            echo "No tests outside ignored folders — skipping"
          fi

  # ─────────────────────────────────────────────
  # J3 — System Interaction (Next.js)
  # ─────────────────────────────────────────────
  j3-ci:
    name: "J3 · Next.js — Install, Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j3-system-interaction/dms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: j3-system-interaction/dms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint --if-present
        continue-on-error: true   # known lint issues tracked in issue #XX — J3 to resolve before demo

      - name: Run tests
        run: npm run test:run --if-present

      - name: Build
        run: npm run build
        env:
          # Prevent Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────────────────────────────
  # J3 — Docker build validation (no push)
  # Push to GHCR happens in cd.yml (#18)
  # ─────────────────────────────────────────────
  j3-docker-validate:
    name: "J3 · Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: j3-ci          # Only validate if app CI passes first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: j3-system-interaction/dms
          file: j3-system-interaction/dms/Dockerfile
          push: false      
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/j3-dms:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # #16 — Trivy Security Scanning
  # Scans J3 Docker image for vulnerabilities
  # Other subgroups scanned once they add Dockerfiles
  # ─────────────────────────────────────────────
  trivy-scan-j3:
    name: "J3 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: j3-docker-validate    # Only scan if image builds successfully

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j3-system-interaction/dms
          file: j3-system-interaction/dms/Dockerfile
          push: false
          load: true             # ← loads image into local Docker daemon so Trivy can scan it
          tags: j3-dms:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j3-dms:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j3-dms:scan
          format: sarif
          output: trivy-j3-results.sarif
        continue-on-error: true  # upload even if scan found issues

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-j3-results.sarif
          category: trivy-j3
        continue-on-error: true  # don't fail if Security tab not enabled

  # ─────────────────────────────────────────────
  # Trivy filesystem scan — catch secrets/misconfigs
  # in source code across ALL subgroups
  # ─────────────────────────────────────────────
  trivy-scan-filesystem:
    name: "All · Trivy — Filesystem & Secret Scan"
    runs-on: ubuntu-latest
    needs: [j2-ci, j3-ci]
    # j2-ci is conditional (only runs on push or when j2 files change).
    # Without this guard, GitHub skips this job whenever j2-ci is skipped.
    if: >-
      always() &&
      needs.j3-ci.result == 'success' &&
      (needs.j2-ci.result == 'success' || needs.j2-ci.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan filesystem for secrets and misconfigs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs           # scan the repo itself, not an image
          scan-ref: .             # scan from root
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: secret,misconfig   # look for hardcoded secrets + bad configs
        continue-on-error: true   # warn but don't block — secrets scan can have false positives

      - name: Upload filesystem scan SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
        continue-on-error: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Trivy placeholders — J1, J2, J4
  # Wired in once they add Dockerfiles
  # ─────────────────────────────────────────────
  trivy-scan-j1-placeholder:
    name: "J1 · Trivy — Pending Dockerfile"
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "J1 Trivy scan will run once edge service Dockerfile is added"

  trivy-scan-j2-placeholder:
    name: "J2 · Trivy — Pending Dockerfile"
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "J2 Trivy scan will run once data service Dockerfile is added"

  # ─────────────────────────────────────────────
  # J4 — Platform & Security (K8s manifest validation)
  # ─────────────────────────────────────────────
  j4-k8s-validate:
    name: "J4 · K8s Manifests — Dry Run Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j4-platform-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Validate K8s manifests (dry-run)
        run: |
          # Validate any manifest files that exist.
          # Exclude grafana/ (provisioning YAMLs are not K8s manifests) and .github/.
          if find . \( -name "*.yaml" -o -name "*.yml" \) ! -path "*/grafana/*" ! -path "*/.github/*" | grep -q .; then
            find . \( -name "*.yaml" -o -name "*.yml" \) \
              ! -path "*/grafana/*" \
              ! -path "*/.github/*" \
              -exec kubectl apply --dry-run=client -f {} \; 2>&1 | \
              grep -v "^Warning" || true
          else
            echo "No K8s manifests found yet — skipping validation"
          fi

  # ─────────────────────────────────────────────
  # J4 — Blockchain Audit Service (Node.js / Hardhat)
  # ─────────────────────────────────────────────
  j4-blockchain-ci:
    name: "J4 · Blockchain Audit — Install, Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j4-platform-security/blockchain-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: j4-platform-security/blockchain-audit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run Hardhat tests
        run: npx hardhat test
        continue-on-error: true

  # ─────────────────────────────────────────────
  # J4 — Trivy Security Scan (Blockchain Audit image)
  # ─────────────────────────────────────────────
  trivy-scan-j4:
    name: "J4 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: j4-blockchain-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j4-platform-security/blockchain-audit
          file: j4-platform-security/blockchain-audit/Dockerfile
          push: false
          load: true
          tags: j4-blockchain-audit:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j4-blockchain-audit:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
        continue-on-error: true

  # ─────────────────────────────────────────────
  # J1 — Device & Edge (placeholder)
  # ─────────────────────────────────────────────
  j1-placeholder:
    name: "J1 · Edge Systems — Pending"
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "J1 CI will be configured once edge service code is committed"