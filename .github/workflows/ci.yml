name: CI — Disaster Response System (Group J)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  ORG: disaster-response-system-group-j

jobs:
  # ─────────────────────────────────────────────
  # J2 — Data & Intelligence (Python / FastAPI)
  # ─────────────────────────────────────────────
  j2-ci:
    name: "J2 · Python — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j2-data-intelligence

    # Only run when J2 files change
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'j2-data-intelligence')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements.txt if it exists, else skip 
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping dependency install"
          fi

      - name: Lint (flake8)
        run: |
          pip install flake8
          # Fail on syntax errors or undefined names; warn on style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests (pytest)
        run: |
          pip install pytest pytest-cov
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest --cov=. --cov-report=xml -v
          else
            echo "No tests found yet — skipping"
          fi

  # ─────────────────────────────────────────────
  # J3 — System Interaction (Next.js)
  # ─────────────────────────────────────────────
  j3-ci:
    name: "J3 · Next.js — Install, Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j3-system-interaction/dms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: j3-system-interaction/dms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true   # Remove once types are stable

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --passWithNoTests --watchAll=false

      - name: Build
        run: npm run build
        env:
          # Prevent Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────────────────────────────
  # J3 — Docker build validation (no push)
  # Push to GHCR happens in cd.yml (#18)
  # ─────────────────────────────────────────────
  j3-docker-validate:
    name: "J3 · Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: j3-ci          # Only validate if app CI passes first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: j3-system-interaction/dms
          file: j3-system-interaction/dms/Dockerfile
          push: false      
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/j3-dms:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # J4 — Platform & Security (K8s manifest validation)
  # ─────────────────────────────────────────────
  j4-k8s-validate:
    name: "J4 · K8s Manifests — Dry Run Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j4-platform-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Validate K8s manifests (dry-run)
        run: |
          # Validate any manifest files that exist
          if find . -name "*.yaml" -o -name "*.yml" | grep -q .; then
            find . \( -name "*.yaml" -o -name "*.yml" \) \
              ! -name "*.github*" \
              -exec kubectl apply --dry-run=client -f {} \; 2>&1 | \
              grep -v "^Warning" || true
          else
            echo "No K8s manifests found yet — skipping validation"
          fi

  # ─────────────────────────────────────────────
  # J1 — Device & Edge (placeholder)
  # ─────────────────────────────────────────────
  j1-placeholder:
    name: "J1 · Edge Systems — Pending"
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "J1 CI will be configured once edge service code is committed"