name: CI — Disaster Response System (Group J)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_PREFIX: dehanns

jobs:
  # ─────────────────────────────────────────────
  # Path detection — determines which jobs run
  # ─────────────────────────────────────────────
  changes:
    name: "Detect Changed Paths"
    runs-on: ubuntu-latest
    outputs:
      j1: ${{ steps.filter.outputs.j1 }}
      j2: ${{ steps.filter.outputs.j2 }}
      j3: ${{ steps.filter.outputs.j3 }}
      j4: ${{ steps.filter.outputs.j4 }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            j1:
              - 'j1-device-edge/**'
            j2:
              - 'j2-data-intelligence/**'
            j3:
              - 'j3-system-interaction/**'
            j4:
              - 'j4-platform-security/**'
            k8s:
              - 'k8s/**'

  # ─────────────────────────────────────────────
  # J1 — Device & Edge
  # ─────────────────────────────────────────────
  j1-docker-validate:
    name: "J1 · Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.j1 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: j1-device-edge/mqtt-kafka-bridge
          file: j1-device-edge/mqtt-kafka-bridge/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/disaster-j1-bridge-api:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan-j1:
    name: "J1 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: [changes, j1-docker-validate]
    if: needs.changes.outputs.j1 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j1-device-edge/mqtt-kafka-bridge
          file: j1-device-edge/mqtt-kafka-bridge/Dockerfile
          push: false
          load: true
          tags: j1-bridge-api:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j1-bridge-api:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j1-bridge-api:scan
          format: sarif
          output: trivy-j1-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-j1-results.sarif
          category: trivy-j1
        continue-on-error: true

  # ─────────────────────────────────────────────
  # J2 — Data & Intelligence (Python / FastAPI)
  # ─────────────────────────────────────────────
  j2-ci:
    name: "J2 · Python — Lint & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.j2 == 'true'
    defaults:
      run:
        working-directory: j2-data-intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt yet — installing known deps temporarily"
            pip install pandas numpy joblib scikit-learn
          fi

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests (pytest)
        run: |
          pip install pytest pytest-cov
          pytest -v --ignore="Model Training and Validation" || {
            exit_code=$?
            if [ $exit_code -eq 5 ]; then
              echo "No tests found — this is okay"
              exit 0
            fi
            exit $exit_code
          }

  trivy-scan-j2:
    name: "J2 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: [changes, j2-ci]
    if: needs.changes.outputs.j2 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j2-data-intelligence
          file: j2-data-intelligence/Dockerfile
          push: false
          load: true
          tags: j2-data-intelligence:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j2-data-intelligence:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j2-data-intelligence:scan
          format: sarif
          output: trivy-j2-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-j2-results.sarif
          category: trivy-j2
        continue-on-error: true

  # ─────────────────────────────────────────────
  # J3 — System Interaction (Next.js)
  # ─────────────────────────────────────────────
  j3-ci:
    name: "J3 · Next.js — Install, Build & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.j3 == 'true'
    defaults:
      run:
        working-directory: j3-system-interaction/dms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: j3-system-interaction/dms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint (ESLint)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests --watchAll=false

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  j3-docker-validate:
    name: "J3 · Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: [changes, j3-ci]
    if: needs.changes.outputs.j3 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: j3-system-interaction/dms
          file: j3-system-interaction/dms/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/disaster-j3-dms:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan-j3:
    name: "J3 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: [changes, j3-docker-validate]
    if: needs.changes.outputs.j3 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j3-system-interaction/dms
          file: j3-system-interaction/dms/Dockerfile
          push: false
          load: true
          tags: j3-dms:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j3-dms:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j3-dms:scan
          format: sarif
          output: trivy-j3-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-j3-results.sarif
          category: trivy-j3
        continue-on-error: true

  # ─────────────────────────────────────────────
  # J4 — Platform Security (Blockchain Audit)
  # ─────────────────────────────────────────────
  j4-docker-validate:
    name: "J4 · Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.j4 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: j4-platform-security/blockchain-audit
          file: j4-platform-security/blockchain-audit/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/disaster-j4-audit-api:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan-j4:
    name: "J4 · Trivy — Security Scan"
    runs-on: ubuntu-latest
    needs: [changes, j4-docker-validate]
    if: needs.changes.outputs.j4 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: j4-platform-security/blockchain-audit
          file: j4-platform-security/blockchain-audit/Dockerfile
          push: false
          load: true
          tags: j4-audit-api:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j4-audit-api:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: j4-audit-api:scan
          format: sarif
          output: trivy-j4-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-j4-results.sarif
          category: trivy-j4
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Trivy filesystem scan — catch secrets/misconfigs
  # Runs on every push regardless of what changed
  # ─────────────────────────────────────────────
  trivy-scan-filesystem:
    name: "All · Trivy — Filesystem & Secret Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan filesystem for secrets and misconfigs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: secret,misconfig
        continue-on-error: true

      - name: Upload filesystem scan SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
        continue-on-error: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
        continue-on-error: true

  # ─────────────────────────────────────────────
  # K8s Manifest Validation
  # ─────────────────────────────────────────────
  k8s-validate:
    name: "K8s · Manifests — Dry Run Validation"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.k8s == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Inject Alertmanager email password
        run: |
          sed -i 's/REPLACE_WITH_REAL_PASSWORD/${{ secrets.ALERTMANAGER_EMAIL_PASSWORD }}/g' k8s/monitoring/alertmanager.yml
        continue-on-error: true

      - name: Validate K8s manifests (dry-run)
        run: |
          if find k8s -name "*.yaml" -o -name "*.yml" | grep -q .; then
            find k8s \( -name "*.yaml" -o -name "*.yml" \) \
              ! -name "*.github*" \
              -exec kubectl apply --dry-run=client -f {} \; 2>&1 | \
              grep -v "^Warning" || true
          else
            echo "No K8s manifests found — skipping validation"
          fi
