name: CI — Disaster Response System (Group J)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_PREFIX: dehanns

jobs:
  # ─────────────────────────────────────────────
  # J2 — Data & Intelligence (Python / FastAPI)
  # ─────────────────────────────────────────────
  j2-ci:
    name: "J2 · Python — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j2-data-intelligence

    # Only run when J2 files change
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'j2-data-intelligence')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          #cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt yet — installing known deps temporarily"
            pip install pandas numpy joblib scikit-learn
          fi

      - name: Lint (flake8)
        run: |
          pip install flake8
          # Fail on syntax errors or undefined names; warn on style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests (pytest)
        run: |
          pip install pytest pytest-cov
          # Run pytest, excluding Model Training folder
          pytest -v --ignore="Model Training and Validation" || {
            exit_code=$?
            # Exit code 5 means no tests collected — that's okay
            if [ $exit_code -eq 5 ]; then
              echo "No tests found — this is okay"
              exit 0
            fi
            exit $exit_code
          }

  # ─────────────────────────────────────────────
  # J3 — System Interaction (Next.js)
  # ─────────────────────────────────────────────
  j3-ci:
    name: "J3 · Next.js — Install, Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j3-system-interaction/dms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: j3-system-interaction/dms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true # Remove once types are stable

      - name: Lint (ESLint)
        run: npm run lint --if-present
        continue-on-error: true # known lint issues tracked in issue #XX — J3 to resolve before demo

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests --watchAll=false

      - name: Build
        run: npm run build
        env:
          # Prevent Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────────────────────────────
  # Docker images — build validation + vulnerability scan
  # Covers every Dockerfile currently in the repo
  # ─────────────────────────────────────────────
  docker-build-and-scan:
    name: "${{ matrix.service }} · Docker — Build & Scan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: J1 Bridge API
            context: j1-device-edge/mqtt-kafka-bridge
            dockerfile: j1-device-edge/mqtt-kafka-bridge/Dockerfile
            image-name: disaster-j1-bridge-api

          - service: J1 Backend
            context: j1-device-edge/backend
            dockerfile: j1-device-edge/backend/Dockerfile
            image-name: disaster-j1-backend

          - service: J2 Data Intelligence
            context: j2-data-intelligence
            dockerfile: j2-data-intelligence/Dockerfile
            image-name: disaster-j2-data-intelligence

          - service: J3 DMS
            context: j3-system-interaction/dms
            dockerfile: j3-system-interaction/dms/Dockerfile
            image-name: disaster-j3-dms

          - service: J4 Audit API
            context: j4-platform-security/blockchain-audit
            dockerfile: j4-platform-security/blockchain-audit/Dockerfile
            image-name: disaster-j4-audit-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image-name }}:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image-name }}:ci-validate
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Run Trivy and upload SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image-name }}:ci-validate
          format: sarif
          output: trivy-${{ matrix.image-name }}.sarif
        continue-on-error: true # upload even if scan found issues

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image-name }}.sarif
          category: trivy-${{ matrix.image-name }}
        continue-on-error: true # don't fail if Security tab not enabled

  # ─────────────────────────────────────────────
  # Trivy filesystem scan — catch secrets/misconfigs
  # in source code across ALL subgroups
  # ─────────────────────────────────────────────
  trivy-scan-filesystem:
    name: "All · Trivy — Filesystem & Secret Scan"
    runs-on: ubuntu-latest
    needs: [j2-ci, j3-ci, k8s-validate] # run after code & manifest jobs pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan filesystem for secrets and misconfigs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs # scan the repo itself, not an image
          scan-ref: . # scan from root
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: secret,misconfig # look for hardcoded secrets + bad configs
        continue-on-error: true # warn but don't block — secrets scan can have false positives

      - name: Upload filesystem scan SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
        continue-on-error: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
        continue-on-error: true

  # ─────────────────────────────────────────────
  # K8s Manifest Validation
  # Validates all K8s manifests in k8s/ folder
  # ─────────────────────────────────────────────
  k8s-validate:
    name: "K8s · Manifests — Dry Run Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Inject Alertmanager email password
        run: |
          sed -i 's/REPLACE_WITH_REAL_PASSWORD/${{ secrets.ALERTMANAGER_EMAIL_PASSWORD }}/g' k8s/monitoring/alertmanager.yml
        continue-on-error: true

      - name: Validate K8s manifests (dry-run)
        run: |
          # Validate manifests in k8s/ folder
          if find k8s -name "*.yaml" -o -name "*.yml" | grep -q .; then
            find k8s \( -name "*.yaml" -o -name "*.yml" \) \
              ! -name "*.github*" \
              -exec kubectl apply --dry-run=client -f {} \; 2>&1 | \
              grep -v "^Warning" || true
          else
            echo "No K8s manifests found — skipping validation"
          fi

  # ─────────────────────────────────────────────
  # J1 — Device & Edge (placeholder)
  # ─────────────────────────────────────────────
  j1-placeholder:
    name: "J1 · Edge Systems — Pending"
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "J1 CI will be configured once edge service code is committed"
